<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>Kestrel Pay - Backend Engineer (Lever style)</title>
<style>body{font:15px system-ui;max-width:640px;margin:32px auto;padding:0 16px}.application-question{margin:14px 0}.application-label{font-weight:600;margin-bottom:4px}input,textarea{width:100%;padding:8px;box-sizing:border-box}#state{margin-top:20px;padding:10px;background:#f3f3f3;font:12px monospace}</style></head>
<body>
<h1>Backend Engineer</h1>
<form id="form">
  <div class="application-question"><div class="application-label">Full name ✱</div><input name="name" required data-react /></div>
  <div class="application-question"><div class="application-label">Email ✱</div><input name="email" type="email" required data-react /></div>
  <div class="application-question"><div class="application-label">Phone</div><input name="phone" data-react /></div>
  <div class="application-question"><div class="application-label">Current company</div><input name="org" data-react /></div>
  <div class="application-question"><div class="application-label">Current location</div><input name="location" data-react /></div>
  <div class="application-question"><div class="application-label">LinkedIn URL</div><input name="urls[LinkedIn]" data-react /></div>
  <div class="application-question"><div class="application-label">GitHub URL</div><input name="urls[GitHub]" data-react /></div>
  <div class="application-question"><div class="application-label">Expected CTC (LPA)</div><input name="cards[ctc]" data-react /></div>
  <div class="application-question"><div class="application-label">Password for your candidate account</div><input name="password" type="password" /></div>
  <button type="submit">Submit application</button>
</form>
<div id="state">Framework state: {}</div>
<script>
  // Imitates React: the app only "sees" values that arrive through input events. A plain
  // el.value = "x" would leave this state empty and the form would submit blanks.
  const state = {};
  for (const el of document.querySelectorAll("[data-react]")) {
    el.addEventListener("input", (e) => { state[e.target.name] = e.target.value; render(); });
  }
  function render() { document.getElementById("state").textContent = "Framework state: " + JSON.stringify(state); }
  document.getElementById("form").addEventListener("submit", (e) => {
    e.preventDefault();
    document.body.innerHTML = "<h1>Application submitted</h1><p>Thanks! We have received your application.</p>";
  });
</script>
</body>
</html>
