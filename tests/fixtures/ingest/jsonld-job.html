<html><head><title>Job</title><script type="application/ld+json">{"@context":"http://schema.org","@type":"JobPosting","baseSalary":{"@type":"MonetaryAmount","currency":"","value":{"@type":"QuantitativeValue","unitText":""}},"datePosted":"2026-11-07","description":"<p><b>Join us as </b>Associate Director Operations, Wild</p><p><b>Location: </b>Hoboken, NJ</p><p><b>Terms &amp; Conditions: </b>Full time, International assignment is not available for this role and relocation for local and international candidates is not provided</p><p><span>This role will be based in the newly established Wild office in Manhattan.</span></p><p></p><p><b>JOB PURPOSE:</b><br />We are looking for a highly skilled and proactive Associate Director, Operations (US) to lead our fulfilment operations across the United States. This is a critical role responsible for delivering excellent customer experience, retail service performance and cost efficiency as we continue to scale rapidly in Wild’s fastest growing market.<br /><br />You will own operational performance across DTC, Amazon and major US Retailers (Walmart &amp; Target) and act as the senior partner to our US 3PL and logistics network. You will combine strategic planning with hands-on operational leadership - ensuring our operations are scalable, efficient and consistently high-performing.<br /><br />You will lead a team of 2 and play a key role in shaping how Operations scales in the US, a key growth market for Wild. This is a high-impact role for someone who loves execution, structured problem solving and commercial operational thinking.<br />You’ll be part of a team that believes in doing work that matters — for people and the planet.<br /><br />Because here, we don’t just hire for jobs. We invite you to be part of something bigger.<br /><br /><b>KEY RESPONSIBILITIES:</b></p><ul><li><p>Operational excellence</p></li><li><p>Own US end-to-end fulfilment and logistics execution across DTC, Amazon and Retail channels</p></li><li><p>Deliver consistently strong performance across OTIF, dispatch SLAs, carrier delivery and inventory accuracy (DTC), and ensure timely execution of display builds / pipefills, reduce chargebacks and improve on-shelf availability metrics (Retail)</p></li><li><p>Define regional customer experience strategy and lead systemic improvements to drive customer delight</p></li><li><p>Set performance standards and engage in regular business reviews with the Ops team and 3PL partners</p></li></ul><p><br />Relationship management<br />Run structured SLA reviews and QBRs, holding partners accountable to performance expectations and contractual commitments<br />Drive a continuous improvement culture across partners, setting clear KPIs and action plans<br />Primary escalation point and strategic relationship owner with US suppliers / logistics partners<br /><br />Commercial and P&amp;L ownership<br />Ownership of US fulfilment KPIs across the P&amp;L and balance sheet<br />Lead negotiations with logistics partners<br />Identify and execute against key margin improvement opportunities across the value chain<br /><br />Continuous process improvement<br />Work closely with the wider operations team to build scalable operational processes, automation and efficiency<br />Implement tooling upgrades enhancing performance visibility and decision-making<br />Drive operational simplification to enable rapid US growth - key is to reduce reliance on manual processes and build scale with a lean team<br /><br />Strategic projects and launch leadership<br />Lead major cross-functional projects (new retailer expansion, new channels, retail pipefill / display moments) and ensure strong launch execution and service performance<br />Proactively manage risk, communication, dependencies and delivery plans<br />Align supply chain/ops readiness with commercial priorities<br />Lead and coordinate the local US rollout of global strategic initiatives, and manage dependencies across Supply Chain, Retail, Tech, Finance and CX<br /><br />Supply chain coordination<br />Work closely with global supply planning teams to minimise out-of-stocks and ensure good stock availability and inventory health<br />Ensure replenishment planning meets demand across all sales channels<br />Lead procurement efforts in line with the global procurement strategy<br />Work with the global quality team to manage product quality and production process issues with US suppliers<br /><br />Team leadership<br />Lead and develop a high-performing US Ops team (Ops Manager, Ops Exec)<br />Build a high-performance team culture grounded in continuous improvement, proactive problem solving and commercial awareness<br />Support organizational growth through hiring, coaching and capability building<br />Set clear accountability, coaching and development plans<br /><br /><b>REQUIRED QUALIFICATIONS:</b></p><ul><li><p>7&#43; years experience in US Operations / Fulfilment leadership roles</p></li><li><p>Deep Walmart &amp; Target fulfilment experience including vendor compliance</p></li><li><p>Proven track record leading 3PL relationships and logistics performance</p></li><li><p>Strong financial acumen with P&amp;L accountability</p></li><li><p>Experience in high-growth, omni-channel consumer brands (beauty/personal care ideal) with proven experience managing relationships and performance for large retailers in the US.</p></li><li><p>Ability to operate both strategically and hands-on in a scaling environment</p></li><li><p>Excellent partner management and clear executive-level communication skills</p></li><li><p>Strong people leader - able to coach, motivate and develop teams</p></li></ul><p></p><p>Pay: The pay range for this position is $146,200 to $219,400. Unilever takes into consideration a wide range of factors that are utilized in making compensation decisions including, but not limited to, skill sets, experience and training, licensure and certifications, qualifications and education, and other business and organizational needs. </p><p>Bonus: This position is bonus eligible. </p><p>Long-Term Incentive (LTI): This position is LTI eligible. </p><p>Benefits: Unilever employees are eligible to participate in our benefits plan. Should the employee choose to participate, they can choose from a range of benefits to include, but is not limited to, health insurance (including prescription drug, dental, and vision coverage), retirement savings benefits, life insurance and disability benefits, parental leave, sick leave, paid vacation and holidays, as well as access to numerous voluntary benefits. Any coverages for health insurance and retirement benefits will be in accordance with the terms and conditions of the applicable plans and associated governing plan documents. </p><p style='text-align:inherit'></p><p style='text-align:inherit'></p><p><span><span><span><span><span><span><span>------------------------------------</span></span></span></span></span></span></span></p><p><span><b>At Unilever, inclusion is at the heart of everything we do</b>. We welcome applicants from all walks of life and are committed to creating an environment where everyone can thrive/succeed. All applicants will receive fair and respectful consideration, and we actively support the growth and development of every employee.</span><br /><br /><b><span>Unilever is an Equal Opportunity Employer/Protected Veterans/Persons with Disabilities.</span></b><br /><br /><span>For more information on your federal rights, please see</span><span><span> </span><a href='https://www.eeoc.gov/sites/default/files/2022-10/EEOC_KnowYourRights_screen_reader_10_20.pdf' target='_blank'>Know Your Rights: Workplace Discrimination is Illegal</a></span></p><p></p><p>Employment is subject to verification of pre-screening tests, which may include drug screening, background check, credit check and DMV check.</p><p></p><p>If you are an individual with a disability in need of assistance at any time during our recruitment process, please con
