# Nightly database backup.
# Add repository secrets: DATABASE_URL (required).
# Optional off-site copy to Cloudflare R2 or S3: BACKUP_S3_BUCKET, AWS_ACCESS_KEY_ID,
# AWS_SECRET_ACCESS_KEY, AWS_DEFAULT_REGION (use "auto" for R2) and BACKUP_S3_ENDPOINT for R2.
name: Nightly database backup

on:
  schedule:
    - cron: "30 20 * * *" # 02:00 IST every day
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      HAS_OFFSITE: ${{ secrets.BACKUP_S3_BUCKET != '' }}
    steps:
      - name: Install PostgreSQL 16 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          FILE="hireflow-$(date -u +%Y-%m-%d).dump"
          /usr/lib/postgresql/16/bin/pg_dump "$DATABASE_URL" --format=custom --no-owner --no-acl --file "$FILE"
          ls -lh "$FILE"
          echo "FILE=$FILE" >> "$GITHUB_ENV"

      - name: Keep 30 days in GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE }}
          path: ${{ env.FILE }}
          retention-days: 30

      - name: Copy off-site (optional)
        if: env.HAS_OFFSITE == 'true'
        env:
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: |
          aws s3 cp "$FILE" "s3://$BACKUP_S3_BUCKET/db/$FILE" ${BACKUP_S3_ENDPOINT:+--endpoint-url "$BACKUP_S3_ENDPOINT"}
