# The big job crawl. Vercel functions stop after a few minutes, so the full crawl runs here instead:
# every 6 hours against the production database, oldest crawled companies first, for up to ~5 hours.
# It is resumable (each company's last crawl time is saved, so the next run continues where this one
# stopped) and safe to run twice (a database lock makes a second crawl exit straight away).
# The Vercel cron (/api/cron/crawl) only does small top ups.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   DATABASE_URL           required, the production database (Supabase pooler URL)
#   ANTHROPIC_API_KEY      optional, classifies job functions the keyword rules can't place
#   ADZUNA_APP_ID, ADZUNA_APP_KEY, JOOBLE_API_KEY   optional job search APIs (read their terms first)
#   CRAWLER_CONTACT_EMAIL  optional, shown in the crawler's user agent
# Logs of a public repository are public: the crawler never prints keys or connection strings.
name: Crawl

on:
  schedule:
    - cron: "15 */6 * * *" # every 6 hours (UTC)
    - cron: "0 3 1 * *"    # monthly: refresh company classification from Wikidata
  workflow_dispatch:
    inputs:
      minutes:
        description: "Stop starting new companies after this many minutes"
        default: "290"
      mode:
        description: "all, feeds-only, aggregators-only, or enrich (Wikidata company classification)"
        default: "all"

concurrency:
  group: crawl
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  crawl:
    if: github.event.schedule != '0 3 1 * *' && github.event.inputs.mode != 'enrich'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
      CRAWLER_CONTACT_EMAIL: ${{ secrets.CRAWLER_CONTACT_EMAIL }}
      NEXT_PUBLIC_APP_URL: https://hireflow-chi-three.vercel.app
      PG_POOL_MAX: "8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "Add the DATABASE_URL repository secret to run the crawl." >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
      - name: Crawl
        # Inputs go through env vars (not ${{ }} in the script) so they can't inject shell commands.
        env:
          MODE: ${{ github.event.inputs.mode || 'all' }}
          MINUTES: ${{ github.event.inputs.minutes || '290' }}
        run: |
          case "$MINUTES" in ''|*[!0-9]*) MINUTES=290 ;; esac
          FLAG=""
          if [ "$MODE" = "feeds-only" ]; then FLAG="--feeds-only"; fi
          if [ "$MODE" = "aggregators-only" ]; then FLAG="--aggregators-only"; fi
          npm run crawl -- --minutes "$MINUTES" --concurrency 10 --details 300 --function-ai 3000 $FLAG

  enrich:
    if: github.event.schedule == '0 3 1 * *' || github.event.inputs.mode == 'enrich'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_APP_URL: https://hireflow-chi-three.vercel.app
      CRAWLER_CONTACT_EMAIL: ${{ secrets.CRAWLER_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Keep the Wikidata cache between runs so only entries older than 30 days are fetched again.
      - uses: actions/cache@v4
        with:
          path: data/wikidata-companies.json
          key: wikidata-${{ github.run_id }}
          restore-keys: wikidata-
      - run: npm run companies:enrich
